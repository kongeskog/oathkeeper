name: corpus checks
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OATHKEEPER_CACHE_DIR: ${{ github.workspace }}/.evidence-cache
    steps:
      - uses: actions/checkout@v4
        with:
          path: corpus
      - uses: actions/checkout@v4
        with:
          repository: kongeskog/oathkeeper
          ref: v0.5.0
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ./engine
      - uses: actions/cache@v4
        with:
          path: ${{ env.OATHKEEPER_CACHE_DIR }}
          key: evidence-${{ hashFiles('corpus/**/sources.lock.json') }}
          restore-keys: evidence-
      - run: python corpus/tools/check.py --fetch
      - run: python -m unittest discover -s corpus/tests -v
      - run: python corpus/tools/build.py --check
      - run: git -C corpus diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: lawlib-generated-${{ github.sha }}
          path: corpus/.build/
          include-hidden-files: true
          retention-days: 30
