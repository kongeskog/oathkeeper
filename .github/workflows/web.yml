name: Web app
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: web
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:content
      - uses: actions/cache@v4
        id: provisions
        with:
          path: web/public/provisions
          key: provisions-${{ hashFiles('web/src/content/provisions-*.json') }}
      - if: steps.provisions.outputs.cache-hit != 'true'
        run: |
          unzip -q public/downloads/lawlib-v0.1.0-dev.4.zip -d "$RUNNER_TEMP/source-snapshot"
          pnpm --dir "$RUNNER_TEMP/source-snapshot/lawlib/tools/inventory" install --frozen-lockfile
          node scripts/fetch-provisions.mjs "$RUNNER_TEMP/source-snapshot/lawlib/tools/inventory/extract-provisions.mjs" "$RUNNER_TEMP/provision-cache" --fetch
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
