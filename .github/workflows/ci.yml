name: checks
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lawlib_package.py sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -- verify examples/hoa.oath
      - run: python3 tools/lawlib_package.py verify
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/lawlib_package.py sync
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.7,<2'
      - run: maturin build --locked --out dist
      - run: python -m pip install dist/*.whl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/oathkeeper
          key: evidence-${{ hashFiles('lawlib.lock.json') }}
          restore-keys: evidence-
      - run: python .deps/lawlib/tools/check.py --fetch --output .build/lawlib
      - run: python -m unittest discover -s python/tests
      - run: python tools/build_lawlib.py --check
      - run: python tools/lawlib_package.py verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../tools/lawlib_package.py sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/oathkeeper
            ~/.cargo/bin/wasm-bindgen
          key: web-tools-0.2.105-${{ runner.os }}-${{ hashFiles('lawlib.lock.json') }}
          restore-keys: web-tools-0.2.105-${{ runner.os }}-
      - run: python -m pip install ..
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: python ../tools/build_web.py --fetch-sources
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-kernel.mjs
