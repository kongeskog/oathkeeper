name: checks
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -- verify examples/hoa.oath
      - run: python3 tools/lawlib_package.py verify
      - run: python3 tools/audit_lawlib.py
      - run: python3 tools/audit_tax.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.7,<2'
      - run: maturin build --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s python/tests
      - run: python lawlib/tools/check.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-kernel.mjs
