[package]
name = "oath-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
oathkeeper = { path = "../crates/oathkeeper" }
[workspace]
members = ["."]
[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false
[[bin]]
name = "certificate_reader"
path = "fuzz_targets/certificate_reader.rs"
test = false
doc = false
bench = false
