[workspace]
members = ["crates/oathkeeper-core", "crates/oathkeeper-cli", "crates/oathkeeper-python", "crates/oathkeeper-wasm"]
default-members = ["crates/oathkeeper-core", "crates/oathkeeper-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
toml = "0.8"
thiserror = "2"
oathkeeper-core = { path = "crates/oathkeeper-core" }
