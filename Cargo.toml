[workspace]
members = ["crates/oath-core", "crates/oath-verify", "crates/oathkeeper", "crates/oath-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
num-bigint = "0.4"
num-rational = "=0.4.2"
num-traits = "0.2"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
